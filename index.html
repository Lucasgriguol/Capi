<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consorcio Natania 21</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: bold; }
        .tab-inactive { color: #6b7280; }
        .sticky-col { position: sticky; left: 0; z-index: 10; background-color: inherit; }
        .sticky-col-header { position: sticky; left: 0; z-index: 20; background-color: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-md p-4 mb-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-home text-blue-600 mr-2"></i> Gastos Vecinales 2026</h1>
            <div class="flex gap-2">
                <!-- Botón temporal para subir los datos locales a Firebase por primera vez 
                <button id="btn-seed" onclick="subirDatosAFirebase()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg text-sm transition hidden">
                    <i class="fas fa-cloud-upload-alt mr-1"></i> Subir Datos Iniciales
                </button> -->
                
                <button id="btn-unlock" onclick="pedirCodigo()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm transition">
                    <i class="fas fa-lock mr-1"></i> Modo Edición
                </button>
                <button id="btn-lock" onclick="cerrarSesion()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm transition hidden">
                    <i class="fas fa-lock-open mr-1"></i> Salir
                </button>
            </div>
        </div>
    </header>

    <!-- Navegación -->
    <div class="max-w-6xl mx-auto px-4 mb-4">
        <div class="flex space-x-6 border-b border-gray-300 overflow-x-auto">
            <button onclick="showTab('resumen')" id="tab-resumen" class="pb-2 tab-active whitespace-nowrap"><i class="fas fa-chart-line mr-1"></i> Resumen General</button>
            <button onclick="showTab('detalle')" id="tab-detalle" class="pb-2 tab-inactive whitespace-nowrap"><i class="fas fa-user-friends mr-1"></i> Aportes por Vecino</button>
            <button onclick="showTab('gastos')" id="tab-gastos" class="pb-2 tab-inactive hidden whitespace-nowrap"><i class="fas fa-file-invoice-dollar mr-1"></i> Cargar Gastos</button>
            <button onclick="showTab('aportes')" id="tab-aportes" class="pb-2 tab-inactive hidden whitespace-nowrap"><i class="fas fa-hand-holding-usd mr-1"></i> Cargar Aportes</button>
        </div>
    </div>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto px-4 pb-10">
        
        <!-- VISTA RESUMEN -->
        <section id="view-resumen">
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm text-left">
                        <thead class="bg-gray-800 text-white uppercase text-xs">
                            <tr>
                                <th class="px-4 py-3">Mes</th>
                                <th class="px-4 py-3 text-right">EPEC</th>
                                <th class="px-4 py-3 text-right">Internet</th>
                                <th class="px-4 py-3 text-right">Seguro</th>
                                <th class="px-4 py-3 text-right">Extras</th>
                                <th class="px-4 py-3 text-right font-bold text-red-300">Egresos</th>
                                <th class="px-4 py-3 text-right font-bold text-green-300">Ingresos</th>
                                <th class="px-4 py-3 text-right font-bold text-yellow-300">Saldo Mes</th>
                                <th class="px-4 py-3 text-right font-bold">Acumulado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-resumen" class="divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- VISTA DETALLE DE APORTES -->
        <section id="view-detalle" class="hidden bg-white rounded-lg shadow overflow-hidden">
            <div class="p-4 border-b bg-gray-50">
                <h2 class="text-lg font-bold text-gray-800">Detalle de Pagos por Vecino</h2>
                <p class="text-sm text-gray-500">Historial de aportes realizados mes a mes.</p>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm text-left">
                    <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
                        <tr id="thead-detalle"></tr>
                    </thead>
                    <tbody id="tbody-detalle" class="divide-y divide-gray-200 bg-white"></tbody>
                </table>
            </div>
        </section>

        <!-- VISTA CARGA DE GASTOS -->
        <section id="view-gastos" class="hidden bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-bold mb-4">Cargar Gastos del Mes</h2>
            <form id="form-gastos" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium">Mes</label>
                    <select id="gasto-mes" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium">EPEC ($)</label>
                    <input type="number" id="gasto-epec" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                </div>
                <div>
                    <label class="block text-sm font-medium">Internet ($)</label>
                    <input type="number" id="gasto-internet" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium">Seguro ($)</label>
                    <input type="number" id="gasto-seguro" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
                
                <div class="md:col-span-2 border-t pt-4 mt-2">
                    <label class="block text-sm font-bold mb-2">Gastos Extras</label>
                    <div id="lista-extras" class="space-y-2 mb-2"></div>
                    <button type="button" onclick="agregarExtra()" class="text-sm text-blue-600 hover:text-blue-800"><i class="fas fa-plus"></i> Agregar otro extra</button>
                </div>

                <div class="md:col-span-2 mt-4">
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Guardar Gastos</button>
                </div>
            </form>
        </section>

        <!-- VISTA CARGA DE APORTES -->
        <section id="view-aportes" class="hidden bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-bold mb-4">Registrar Pago de un Vecino</h2>
            <p class="text-sm text-gray-500 mb-4">Selecciona el mes, el vecino y el monto que entregó.</p>
            
            <form id="form-aportes" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium">Mes a pagar</label>
                    <select id="aporte-mes" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium">Vecino</label>
                    <select id="aporte-vecino" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium">Monto ($)</label>
                    <input type="number" id="aporte-monto" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required placeholder="Ej: 10000">
                </div>
                
                <div class="md:col-span-3 mt-4">
                    <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">Registrar Pago</button>
                </div>
            </form>
        </section>

    </main>

    <!-- data.js se carga normal para definir variables globales -->
    <script src="data.js"></script>
    <!-- app.js se carga como módulo para poder usar los imports de Firebase -->
    <script type="module" src="app.js"></script>
</body>
</html>
